name: Build DC-ELM327 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 repository secret'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dc-elm327-release.jks"
          chmod 600 "$RUNNER_TEMP/dc-elm327-release.jks"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dc-elm327-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD repository secret'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS repository secret'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD repository secret'; exit 1; }
          ./gradlew :androbd:assembleRelease --stacktrace
          apk="androbd/build/outputs/apk/release/androbd-release.apk"
          test -s "$apk"
          mv "$apk" "androbd/build/outputs/apk/release/DC-ELM327-release.apk"
          sha256sum "androbd/build/outputs/apk/release/DC-ELM327-release.apk" > "androbd/build/outputs/apk/release/SHA256SUMS.txt"
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: DC-ELM327-release
          path: |
            androbd/build/outputs/apk/release/DC-ELM327-release.apk
            androbd/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: "release-${{ github.run_number }}"
          name: "DC-ELM327 release #${{ github.run_number }}"
          artifacts: "androbd/build/outputs/apk/release/DC-ELM327-release.apk,androbd/build/outputs/apk/release/SHA256SUMS.txt"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
